apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-tool-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-tool-v3
  template:
    metadata:
      labels:
        app: project-tool-v3
    spec:
      containers:
        - name: project-tool-v3
          image: sireeshagarlapati29/project-tool:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: project-tool-v3-service
spec:
  type: ClusterIP
  selector:
    app: project-tool-v3
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP