apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-tool-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-tool-v1
  template:
    metadata:
      labels:
        app: project-tool-v1
    spec:
      containers:
        - name: project-tool-v1
          image: sireeshagarlapati29/project-tool:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: project-tool-v1-service
spec:
  type: ClusterIP
  selector:
    app: project-tool-v1
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      